# The release gate on a GitHub-hosted runner (Task 23.6, R4, Avi decision 3): a fresh local Supabase stack with every
# migration replayed, the local Edge functions, then `npm run verify` (scripts/verify.mjs), the same gate as on a
# development machine except for one step: the development browser suite is not run here (see the Release gate step). No
# hosted project, key or secret is used: the stack is local to the runner and the worker secret is generated for the run.
# Nothing here prints the local keys (`supabase start` writes them only to a file in RUNNER_TEMP).
# Exit 2 from the gate is reserved for failures that are all named known blockers (still a red run). None is listed
# (scripts/verify.mjs KNOWN_BLOCKERS is empty since Task 23.8), so today any failure exits 1.
# Actions are pinned to full commit SHAs, each resolved read-only on 2026-10-19 (`gh api repos/<action>/commits/<tag>`); each
# release tag and its major tag (v4) pointed to the same commit.
name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install the pinned dependencies (package-lock.json)
        run: npm ci

      - name: Start a fresh local Supabase stack (every migration replayed)
        run: |
          npx supabase start --exclude studio,realtime,storage-api,imgproxy,mailpit,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            # The log holds the local keys: print only its error lines, without any line naming a credential.
            grep -iE 'error|fail' "$RUNNER_TEMP/supabase-start.log" | grep -viE 'key|secret|jwt|token|password|postgres(ql)?://' || true
            exit 1
          }

      - name: Configure the local Edge functions (a random worker secret, never printed)
        run: |
          node -e "const c = require('node:crypto'); require('node:fs').writeFileSync('.env.edge.local', 'GAME_ALLOWED_ORIGINS=http://127.0.0.1:3000\nGAME_WORKER_SECRET=' + c.randomBytes(32).toString('base64url') + '\n')"

      - name: Serve the local Edge functions in the background
        run: |
          nohup npx supabase functions serve --env-file .env.edge.local > "$RUNNER_TEMP/edge.log" 2>&1 &

      - name: Release gate
        # The controller's CI exception (Task 24.0d, 2026-10-21): this free runner is too slow for the development browser suite
        # (next dev compiles each route on demand, and Chrome renders WebGL in software, with no GPU). Run 39452911203 failed 51
        # of its tests there, and run 39588134783, with the 148 render-bound runs already left out, still failed 50 in 52 min,
        # mostly 30 s timeouts across 19 files. CLOUDIATOR_CI=github (set here and nowhere else) makes scripts/verify.mjs mark
        # that one step `not run on CI` and say so on its summary line and in the result line, never silently. Every other
        # step runs, and the production gate (the isolated production build and its browser run) is unchanged. The local
        # `npm run verify`, the gate of record, runs every step, the development browser suite included.
        env:
          CLOUDIATOR_CI: github
        run: |
          npm run verify -- --json "$RUNNER_TEMP/verify.json"

      - name: Keep the gate's results and the browser traces
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate
          path: |
            ${{ runner.temp }}/verify.json
            test-results/
          if-no-files-found: ignore
          retention-days: 14
